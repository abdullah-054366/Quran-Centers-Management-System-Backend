name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: mushka-api
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  # 1) CI: نفس فحوصاتك السابقة في dotnet.yml
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore QuranCenterManager_API.slnx

      - name: Build (warnings as errors)
        run: dotnet build QuranCenterManager_API.slnx --no-restore --configuration Release --warnaserror

  # 2) بناء صورة Docker ورفعها إلى GHCR (عند الدفع إلى main فقط)
  docker:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) CD: النشر على السيرفر
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: ${{ env.COMPOSE_FILE }}
          target: ${{ vars.DEPLOY_PATH || '/opt/mushka-api' }}

      - name: Pull & restart API
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mushka-api' }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_PATH,OWNER,TAG
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"
            export API_IMAGE="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/mushka-api:$TAG"
            DC="docker compose -f docker-compose.prod.yml --env-file .env"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $DC pull api
            $DC up -d db              # لا يفعل شيئاً إن كانت القاعدة تعمل
            $DC up -d --no-deps api
            docker logout ghcr.io

            # تأكد أن الحاوية بقيت تعمل (ولم تنهَر بعد التشغيل)
            sleep 15
            STATUS=$(docker inspect -f '{{.State.Status}}' mushka-api)
            if [ "$STATUS" != "running" ]; then
              echo "API failed to start ($STATUS)"
              $DC logs --tail=100 api
              exit 1
            fi
            echo "Deployed $API_IMAGE"
            docker image prune -f
