services:
  quran-center-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: quran-center-api:local
    container_name: quran-center-api
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION:?Set DB_CONNECTION in .env}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
